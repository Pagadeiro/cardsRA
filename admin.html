<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin AR - Simplificado</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { color: #e94560; text-align: center; }
        .card { background: #16213e; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #0f3460;
            background: #0f3460; color: #eee; font-size: 14px; margin-bottom: 10px;
        }
        button {
            background: #e94560; color: white; border: none; padding: 12px 20px;
            border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;
            width: 100%; margin-top: 10px;
        }
        button:hover { background: #c73650; }
        button:disabled { background: #555; cursor: not-allowed; }
        .msg { padding: 10px; border-radius: 5px; margin: 10px 0; text-align: center; }
        .msg.ok { background: #1b5e20; }
        .msg.err { background: #b71c1c; }
        .hidden { display: none; }
        .produto-item {
            background: #0f3460; padding: 15px; border-radius: 8px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .produto-item .info { flex: 1; min-width: 200px; }
        .produto-item .info small { color: #aaa; word-break: break-all; display: block; margin-top: 5px; }
        .btn-del { background: #b71c1c; width: auto; padding: 8px 15px; font-size: 12px; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ Painel Admin AR</h1>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="card">
        <h2>Entrar</h2>
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="seu@email.com">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="********">
        <button onclick="fazerLogin()">Entrar</button>
        <div id="login-msg"></div>
    </div>

    <!-- PAINEL -->
    <div id="painel-screen" class="hidden">
        <div class="card">
            <h2>📤 Cadastrar Novo Produto</h2>
            <p style="font-size: 13px; color: #aaa;">Vá no GitHub Releases, faça upload do seu arquivo e cole o link gerado abaixo.</p>
            
            <label>Nome do Produto (ex: "Convite Ana e João")</label>
            <input type="text" id="prod-nome" placeholder="Nome do produto">

            <label>Link do arquivo .mind (ZIP)</label>
            <input type="https://github.com/user-attachments/files/34506171/CHLOECAPIVARINHA.zip" id="prod-mind-link" placeholder="https://github.com/.../targets.mind.zip">

            <label>Link do arquivo .glb (ZIP)</label>
            <input type="https://github.com/user-attachments/files/34506229/CHLOETA.NA.ESCOLA.zip" id="prod-glb-link" placeholder="https://github.com/.../modelo.glb">

            <button id="btn-salvar" onclick="salvarProduto()">Salvar Produto</button>
            <div id="upload-msg"></div>
        </div>

        <div class="card">
            <h2>📋 Produtos Cadastrados</h2>
            <div id="lista-produtos">Carregando...</div>
        </div>

        <button onclick="fazerLogout()" style="background:#555; margin-top:10px;">Sair</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc }
        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ============================================================
    // 🔧 COLE AQUI SUA CONFIGURAÇÃO DO FIREBASE
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyB70HA4_pKWuUZRW6ZUH3xGOKfx181mByo",
        authDomain: "cardsra.firebaseapp.com",
        projectId: "cardsra",
        storageBucket: "cardsra.firebasestorage.app",
        messagingSenderId: "815134338089",
        appId: "1:815134338089:web:30500a2c42cd3be9550038"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ============================================================
    // LÓGICA DE LOGIN
    // ============================================================
    window.fazerLogin = async function() {
        const email = document.getElementById('login-email').value;
        const senha = document.getElementById('login-senha').value;
        const msg = document.getElementById('login-msg');
        msg.className = 'msg'; msg.textContent = 'Entrando...';
        try {
            await signInWithEmailAndPassword(auth, email, senha);
            msg.textContent = '';
        } catch (e) {
            msg.className = 'msg err'; msg.textContent = 'Erro: ' + e.message;
        }
    };

    window.fazerLogout = async function() { await signOut(auth); };

    onAuthStateChanged(auth, (user) => {
        const loginScreen = document.getElementById('login-screen');
        const painelScreen = document.getElementById('painel-screen');
        if (user) {
            loginScreen.classList.add('hidden'); painelScreen.classList.remove('hidden');
            carregarProdutos();
        } else {
            loginScreen.classList.remove('hidden'); painelScreen.classList.add('hidden');
        }
    });

    // ============================================================
    // SALVAR PRODUTO
    // ============================================================
    window.salvarProduto = async function() {
        const nome = document.getElementById('prod-nome').value.trim();
        const mindUrl = document.getElementById('prod-mind-link').value.trim();
        const glbUrl = document.getElementById('prod-glb-link').value.trim();
        const msg = document.getElementById('upload-msg');
        const btn = document.getElementById('btn-salvar');

        if (!nome || !mindUrl || !glbUrl) {
            msg.className = 'msg err'; msg.textContent = 'Preencha todos os campos.';
            return;
        }

        btn.disabled = true;
        msg.className = 'msg'; msg.textContent = 'Salvando no banco de dados...';

        try {
            // Gera um ID único curto para o produto
            const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
            
            await addDoc(collection(db, 'produtos'), {
                nome: nome,
                mindUrl: mindUrl,
                glbUrl: glbUrl,
                criadoEm: new Date().toISOString(),
                id: id // Este ID será usado na URL do cliente (ex: ?id=abc123)
            });

            msg.className = 'msg ok'; msg.textContent = 'Produto salvo com sucesso!';
            document.getElementById('prod-nome').value = '';
            document.getElementById('prod-mind-link').value = '';
            document.getElementById('prod-glb-link').value = '';
            carregarProdutos();
        } catch (e) {
            msg.className = 'msg err'; msg.textContent = 'Erro ao salvar: ' + e.message;
        } finally {
            btn.disabled = false;
        }
    };

    // ============================================================
    // LISTAR PRODUTOS
    // ============================================================
    async function carregarProdutos() {
        const lista = document.getElementById('lista-produtos');
        lista.innerHTML = 'Carregando...';
        try {
            const snap = await getDocs(collection(db, 'produtos'));
            if (snap.empty) {
                lista.innerHTML = '<p>Nenhum produto cadastrado ainda.</p>';
                return;
            }
            let html = '';
            snap.forEach((docSnap) => {
                const d = docSnap.data();
                html += `
                    <div class="produto-item">
                        <div class="info">
                            <strong>${d.nome}</strong>
                            <small>ID do Link: <b>${d.id}</b></small>
                            <small>Mind: ${d.mindUrl}</small>
                            <small>Glb: ${d.glbUrl}</small>
                        </div>
                        <button class="btn-del" onclick="deletarProduto('${docSnap.id}')">Excluir</button>
                    </div>
                `;
            });
            lista.innerHTML = html;
        } catch (e) {
            lista.innerHTML = '<p style="color:#e94560;">Erro ao carregar: ' + e.message + '</p>';
        }
    }

    window.deletarProduto = async function(docId) {
        if (!confirm('Excluir este produto?')) return;
        try { await deleteDoc(doc(db, 'produtos', docId)); carregarProdutos(); }
        catch (e) { alert('Erro ao excluir: ' + e.message); }
    };
</script>
</body>
</html>
