<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Experiência de Realidade Aumentada</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background: #000; }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1a1a2e; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999; text-align: center; padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3); border-top: 4px solid #e94560;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #error-msg { color: #e94560; margin-top: 20px; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Preparando sua experiência...</h2>
        <p id="loading-text">Buscando informações...</p>
        <p id="error-msg" class="hidden"></p>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: ;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" class="hidden">
        <a-assets id="ar-assets"></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="ar-target-entity" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // ============================================================
        // 🔧 COLE AQUI SUA CONFIGURAÇÃO DO FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "COLE_AQUI",
            authDomain: "COLE_AQUI",
            projectId: "COLE_AQUI",
            storageBucket: "COLE_AQUI",
            messagingSenderId: "COLE_AQUI",
            appId: "COLE_AQUI"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loadingText = document.getElementById('loading-text');
        const errorMsg = document.getElementById('error-msg');

        function mostrarErro(texto) {
            loadingText.classList.add('hidden');
            errorMsg.classList.remove('hidden');
            errorMsg.textContent = texto;
            const spinner = document.querySelector('.spinner');
            if (spinner) spinner.classList.add('hidden');
        }

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const produtoId = urlParams.get('id');

            if (!produtoId) {
                mostrarErro('Link inválido. O ID do produto não foi encontrado na URL.');
                return;
            }

            try {
                loadingText.textContent = 'Buscando produto no banco de dados...';
                // Busca no Firestore o produto
                const q = query(collection(db, 'produtos'), where('idLink', '==', produtoId));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    mostrarErro('Produto não encontrado. Verifique o link.');
                    return;
                }

                const produto = querySnapshot.docs[0].data();
                
                loadingText.textContent = 'Baixando arquivo de imagem (.mind)...';
                const respostaMind = await fetch(produto.mindUrl);
                if (!respostaMind.ok) throw new Error("Falha ao baixar o .mind do GitHub.");
                const blobMindZip = await respostaMind.blob();

                loadingText.textContent = 'Descompactando .mind...';
                const zipMind = await JSZip.loadAsync(blobMindZip);
                const nomeArquivoMind = Object.keys(zipMind.files)[0]; 
                const blobMind = await zipMind.files[nomeArquivoMind].async("blob");
                const mindBlobUrl = URL.createObjectURL(blobMind);

                loadingText.textContent = 'Baixando modelo 3D (.glb)...';
                const respostaGlb = await fetch(produto.glbUrl);
                if (!respostaGlb.ok) throw new Error("Falha ao baixar o .glb do GitHub.");
                const blobGlbZip = await respostaGlb.blob();

                loadingText.textContent = 'Descompactando modelo 3D...';
                const zipGlb = await JSZip.loadAsync(blobGlbZip);
                const nomeArquivoGlb = Object.keys(zipGlb.files)[0];
                const blobGlb = await zipGlb.files[nomeArquivoGlb].async("blob");
                const glbBlobUrl = URL.createObjectURL(blobGlb);

                loadingText.textContent = 'Iniciando câmera...';
                iniciarAR(mindBlobUrl, glbBlobUrl);

            } catch (erro) {
                console.error(erro);
                mostrarErro('Ocorreu um erro: ' + erro.message);
            }
        });

        function iniciarAR(mindUrl, glbUrl) {
            const scene = document.getElementById('ar-scene');
            const assets = document.getElementById('ar-assets');
            const targetEntity = document.getElementById('ar-target-entity');

            scene.setAttribute('mindar-image', `imageTargetSrc: ${mindUrl};`);

            const assetItem = document.createElement('a-asset-item');
            assetItem.setAttribute('id', 'ar-model');
            assetItem.setAttribute('src', glbUrl);
            assets.appendChild(assetItem);

            const modelEntity = document.createElement('a-gltf-model');
            modelEntity.setAttribute('src', '#ar-model');
            modelEntity.setAttribute('position', '0 0 0.5');
            modelEntity.setAttribute('scale', '1 1 1');
            targetEntity.appendChild(modelEntity);

            document.getElementById('loading-screen').classList.add('hidden');
            scene.classList.remove('hidden');

            setTimeout(() => {
                if (scene.systems['mindar-image-system']) {
                    scene.systems['mindar-image-system'].start();
                }
            }, 500);
        }
    </script>
</body>
</html>
