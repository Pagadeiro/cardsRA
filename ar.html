<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Experiência AR</title>
    
    <!-- Bibliotecas -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1a1a2e; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            font-family: Arial, sans-serif; text-align: center; padding: 20px;
        }
        #start-btn {
            padding: 15px 40px; font-size: 20px; background: #e94560; color: white;
            border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; font-weight: bold;
        }
        #loading { display: none; margin-top: 20px; font-size: 16px; color: #aaa; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h2>Realidade Aumentada</h2>
        <p>Toque no botão abaixo e permita o acesso à câmera.</p>
        <button id="start-btn">Iniciar AR</button>
        <div id="loading">Baixando arquivos... Aguarde.</div>
    </div>

    <script>
        document.getElementById('start-btn').addEventListener('click', async () => {
            const btn = document.getElementById('start-btn');
            const loading = document.getElementById('loading');
            
            // Esconde o botão e mostra o aviso de carregamento
            btn.style.display = 'none';
            loading.style.display = 'block';

            try {
                // 1. Pedir permissão de movimento (necessário para iOS)
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    await DeviceMotionEvent.requestPermission();
                }

                // 2. Pedir permissão da câmera
                await navigator.mediaDevices.getUserMedia({ video: true });

                // 3. Links RAW dos seus arquivos .zip
                const urlMindZip = "https://raw.githubusercontent.com/Pagadeiro/cardsRA/main/CHLOECAPIVARINHA.zip";
                const urlGlbZip = "https://raw.githubusercontent.com/Pagadeiro/cardsRA/main/CHLOETA%20NA%20ESCOLA.zip";

                loading.innerText = "Baixando imagem (.mind)...";
                const resMind = await fetch(urlMindZip);
                const blobMindZip = await resMind.blob();
                const zipMind = await JSZip.loadAsync(blobMindZip);
                const nomeMind = Object.keys(zipMind.files)[0];
                const blobMind = await zipMind.files[nomeMind].async("blob");
                const mindUrl = URL.createObjectURL(blobMind);

                loading.innerText = "Baixando modelo 3D (.glb)...";
                const resGlb = await fetch(urlGlbZip);
                const blobGlbZip = await resGlb.blob();
                const zipGlb = await JSZip.loadAsync(blobGlbZip);
                const nomeGlb = Object.keys(zipGlb.files)[0];
                const blobGlb = await zipGlb.files[nomeGlb].async("blob");
                const glbUrl = URL.createObjectURL(blobGlb);

                loading.innerText = "Iniciando câmera...";
                
                // 4. Cria a cena AR dinamicamente para evitar bugs do MindAR
                const sceneHTML = `
                    <a-scene mindar-image="imageTargetSrc: ${mindUrl};" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
                        <a-assets>
                            <a-asset-item id="modelo3d" src="${glbUrl}"></a-asset-item>
                        </a-assets>
                        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
                        <a-entity mindar-image-target="targetIndex: 0">
                            <a-gltf-model src="#modelo3d" position="0 0 0.5" scale="1 1 1"></a-gltf-model>
                        </a-entity>
                    </a-scene>
                `;

                // Insere a cena no HTML
                document.body.insertAdjacentHTML('beforeend', sceneHTML);
                
                // Remove a tela inicial
                document.getElementById('start-overlay').style.display = 'none';

            } catch (error) {
                loading.innerText = "Erro: " + error.message;
                loading.style.color = "#e94560";
            }
        });
    </script>
</body>
</html>
