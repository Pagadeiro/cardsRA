<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Experiência de Realidade Aumentada</title>

    <!-- Bibliotecas do A-Frame e MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #1a1a2e; }
        
        /* Tela de carregamento */
        #loading {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1a1a2e; color: white; display: flex;
            justify-content: center; align-items: center;
            font-family: Arial, sans-serif; font-size: 18px;
            z-index: 9999; flex-direction: column; text-align: center; padding: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3); border-top: 4px solid #e94560;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Tela de carregamento -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Baixando modelo 3D...<br>Aguarde, isso pode levar alguns segundos.</p>
    </div>

    <!-- Cena AR -->
    <a-scene
        mindar-image="imageTargetSrc: https://files.catbox.moe/3y1w7f.mind;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Carrega o modelo GLB otimizado -->
        <a-assets>
            <a-asset-item id="modelo3d" src="https://files.catbox.moe/s6wy14.glb"></a-asset-item>
        </a-assets>

        <!-- Câmera do celular -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Alvo (a imagem que será reconhecida) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- O modelo 3D aparece em cima da imagem -->
            <a-gltf-model src="#modelo3d" position="0 0 0.5" scale="1 1 1"></a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        // Esconde a tela de carregamento e inicia a câmera assim que a cena estiver pronta
        const scene = document.querySelector('a-scene');
        
        if (scene.hasLoaded) {
            document.getElementById('loading').classList.add('hidden');
        } else {
            scene.addEventListener('loaded', () => {
                document.getElementById('loading').classList.add('hidden');
            });
        }
    </script>

</body>
</html>
