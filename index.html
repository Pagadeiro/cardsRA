<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Experiência de Realidade Aumentada</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ar-container { width: 100vw; height: 100vh; }
        #admin-panel {
            position: fixed; top: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: white; padding: 15px;
            border-radius: 8px; max-width: 300px; display: none;
        }
        #admin-toggle {
            position: fixed; bottom: 20px; right: 20px; z-index: 1001;
            background: #333; color: white; border: none; padding: 10px 15px;
            border-radius: 50px; cursor: pointer;
        }
        #loading-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; background: rgba(0,0,0,0.7); padding: 20px;
            border-radius: 10px; z-index: 999; text-align: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Área de exibição AR -->
<div id="ar-container">
    <a-scene id="ar-scene" mindar-image="imageTargetSrc: targets.mind;"
             color-space="sRGB"
             renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false"
             device-orientation-permission-ui="enabled: false">
        
        <a-assets id="ar-assets">
            <!-- O modelo GLB será injetado dinamicamente via JS -->
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- O conteúdo do modelo 3D será injetado dinamicamente via JS -->
        <a-entity id="ar-target-entity" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>
</div>

<div id="loading-msg">Carregando experiência AR...</div>

<!-- Área Administrativa -->
<button id="admin-toggle" onclick="toggleAdmin()">⚙️ Admin</button>

<div id="admin-panel">
    <h3>Painel Administrativo</h3>
    
    <label>Arquivo .mind (Target):</label><br>
    <input type="file" id="mind-file" accept=".mind"><br><br>
    
    <label>Modelo .glb (AR):</label><br>
    <input type="file" id="glb-file" accept=".glb"><br><br>
    
    <button onclick="uploadFiles()" style="background:#4CAF50;color:white;padding:8px 16px;border:none;border-radius:4px;cursor:pointer;">Salvar (Simulação)</button>
    <p style="font-size:12px;color:#aaa;">Nota: Sem conexão com Firebase, os arquivos não serão persistidos. O upload real será explicado no segundo passo.</p>
</div>

<script>
    // ========== Configuração ==========
    const CONFIG = {
        mindFile: 'targets.mind',   // Nome do arquivo .mind padrão
        glbFile: 'model.glb'        // Nome do arquivo .glb padrão
    };

    // ========== Inicialização AR ==========
    function initAR(mindSrc, glbSrc) {
        const scene = document.getElementById('ar-scene');
        const assets = document.getElementById('ar-assets');
        const targetEntity = document.getElementById('ar-target-entity');

        // Atualiza source do mind
        scene.setAttribute('mindar-image', `imageTargetSrc: ${mindSrc};`);

        // Limpa assets e entidade anteriores
        assets.innerHTML = '';
        targetEntity.innerHTML = '';

        // Cria asset do GLB
        const assetItem = document.createElement('a-asset-item');
        assetItem.setAttribute('id', 'ar-model');
        assetItem.setAttribute('src', glbSrc);
        assets.appendChild(assetItem);

        // Cria modelo dentro do target
        const modelEntity = document.createElement('a-gltf-model');
        modelEntity.setAttribute('src', '#ar-model');
        modelEntity.setAttribute('position', '0 0 0.5');
        modelEntity.setAttribute('scale', '1 1 1');
        targetEntity.appendChild(modelEntity);

        // Esconde mensagem de carregamento
        document.getElementById('loading-msg').classList.add('hidden');

        console.log('AR inicializado com:', mindSrc, glbSrc);
    }

    // Inicialização padrão (usa arquivos locais)
    window.addEventListener('load', () => {
        // Tenta usar arquivos locais padrão
        // Se não existirem, mostra erro mas não quebra
        try {
            initAR(CONFIG.mindFile, CONFIG.glbFile);
        } catch (e) {
            console.warn('Arquivos padrão não encontrados. Use o painel admin para configurar.');
            document.getElementById('loading-msg').innerHTML = 
                'Nenhum arquivo AR configurado.<br>Use o painel Admin (canto inferior direito) para carregar .mind e .glb.';
        }
    });

    // ========== Área Administrativa ==========
    function toggleAdmin() {
        const panel = document.getElementById('admin-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function uploadFiles() {
        const mindInput = document.getElementById('mind-file');
        const glbInput = document.getElementById('glb-file');

        if (!mindInput.files[0] || !glbInput.files[0]) {
            alert('Selecione ambos os arquivos: .mind e .glb');
            return;
        }

        // Cria URLs temporárias para visualização imediata (não persiste após recarregar)
        const mindUrl = URL.createObjectURL(mindInput.files[0]);
        const glbUrl = URL.createObjectURL(glbInput.files[0]);

        // Reinicializa AR com os novos arquivos
        initAR(mindUrl, glbUrl);

        alert('Arquivos carregados temporariamente. Para persistir, conecte ao Firebase (veja o segundo passo).');
    }
</script>

</body>
</html>
